    <section class="card card-title">
        <p class="kicker">Scale</p>
        <h1 class="h-xl">The biggest breaches, one dot per million</h1>
        <p class="lede">Every dot is a million records. Hover or tap a cluster for what happened and the source.</p>
    </section>
    <section class="card">
      <div class="scale-controls">
        <div class="seg" id="yearSeg" role="tablist" aria-label="Years">
          <button type="button" role="tab" data-years="all" aria-selected="true">All years</button>
          <button type="button" role="tab" data-years="2013-2019" aria-selected="false">2013–2019</button>
          <button type="button" role="tab" data-years="2020-2023" aria-selected="false">2020–2023</button>
          <button type="button" role="tab" data-years="2024-2026" aria-selected="false">2024–2026</button>
        </div>
        <div class="chips" id="causeChips" aria-label="Causes"></div>
        <label class="switch"><input type="checkbox" id="compiledToggle"><span class="track" aria-hidden="true"></span>Include compilations of old leaks</label>
        <div class="seg seg-sm" id="sortSeg" role="tablist" aria-label="Sort">
          <button type="button" role="tab" data-sort="size" aria-selected="true">Biggest</button>
          <button type="button" role="tab" data-sort="year" aria-selected="false">Newest</button>
        </div>
      </div>
      <p class="scale-summary mono" id="scaleSummary"></p>
      <div class="scale-stage" id="scaleStage">
        <canvas id="scaleCanvas" role="img" aria-label="Breaches drawn as clusters of dots, one dot per million records"></canvas>
        <div class="tip" id="scaleTip" hidden></div>
      </div>
      <ul class="legend" aria-label="Legend">
        <li><i class="lg confirmed"></i>Confirmed</li>
        <li><i class="lg reported"></i>Reported, no company count</li>
        <li><i class="lg claimed"></i>Attackers’ claim</li>
        <li><i class="lg compiled"></i>Compilation of old leaks</li>
      </ul>
      <div class="detail" id="scaleDetail" aria-live="polite"></div>
      <noscript><p>The breach list is also on the Sources page.</p></noscript>
    </section>
